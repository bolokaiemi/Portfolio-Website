<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone UI</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- PHONE SCREEN -->
<div class="screen">

    <!-- APPS GRID -->
    <div class="apps">

        <a href="https://www.google.com" target="_blank" class="app">
            <i class="fab fa-google"></i>
            <span>Google</span>
        </a>

        <a href="https://www.youtube.com" target="_blank" class="app">
            <i class="fab fa-youtube"></i>
            <span>YouTube</span>
        </a>

        <a href="https://www.facebook.com" target="_blank" class="app">
            <i class="fab fa-facebook"></i>
            <span>Facebook</span>
        </a>

        <a href="https://www.instagram.com" target="_blank" class="app">
            <i class="fab fa-instagram"></i>
            <span>Instagram</span>
        </a>

        <a href="https://www.whatsapp.com" target="_blank" class="app">
            <i class="fab fa-whatsapp"></i>
            <span>WhatsApp</span>
        </a>

        <a href="https://www.tiktok.com" target="_blank" class="app">
            <i class="fab fa-tiktok"></i>
            <span>TikTok</span>
        </a>

        <a href="https://www.linkedin.com" target="_blank" class="app">
            <i class="fab fa-linkedin"></i>
            <span>LinkedIn</span>
        </a>

        <a href="mailto:test@example.com" class="app">
            <i class="fas fa-envelope"></i>
            <span>Mail</span>
        </a>

        <a href="#" class="app">
            <i class="fas fa-camera"></i>
            <span>Camera</span>
        </a>

        <a href="#" class="app">
            <i class="fas fa-music"></i>
            <span>Music</span>
        </a>

    </div>

    <!-- BOTTOM SOCIAL BAR -->
    <div class="icons">

        <a href="https://facebook.com" target="_blank">
            <i class="fab fa-facebook-f"></i>
        </a>

        <a href="https://instagram.com" target="_blank">
            <i class="fab fa-instagram"></i>
        </a>

        <a href="https://twitter.com" target="_blank">
            <i class="fab fa-x-twitter"></i>
        </a>

        <a href="https://youtube.com" target="_blank">
            <i class="fab fa-youtube"></i>
        </a>

        <a href="https://whatsapp.com" target="_blank">
            <i class="fab fa-whatsapp"></i>
        </a>

    </div>

</div>

</body>
</html>
