<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone UI</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<style>
    /* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BODY BACKGROUND */
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", sans-serif;

    /* modern gradient */
    background: linear-gradient(135deg, #667eea, #764ba2, #ff758c);
}

/* PHONE FRAME */
.phone {
    width: 320px;
    height: 600px;
    border-radius: 35px;
    overflow: hidden;
    position: relative;

    /* glass effect */
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(20px);

    box-shadow: 
        0 20px 40px rgba(0,0,0,0.4),
        inset 0 0 10px rgba(255,255,255,0.1);
}

/* SCREEN */
.screen {
    height: calc(100% - 70px);
    overflow-y: auto;
    padding: 20px;
    scroll-behavior: smooth;
}

/* SCROLLBAR */
.screen::-webkit-scrollbar {
    width: 6px;
}

.screen::-webkit-scrollbar-thumb {
    background: linear-gradient(#ff758c, #667eea);
    border-radius: 10px;
}

/* APP GRID */
.apps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

/* APP LINK (IMPORTANT FIX) */
.app {
    text-decoration: none;
    color: white;
    text-align: center;
    font-size: 12px;
}

/* APP ICON */
.app i {
    display: block;
    font-size: 22px;
    padding: 16px;
    border-radius: 18px;
    margin-bottom: 6px;
    color: white;

    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    box-shadow: 0 8px 15px rgba(0,0,0,0.3);

    transition: all 0.3s ease;
}

/* DIFFERENT COLORS */
.app:nth-child(2) i { background: linear-gradient(135deg, #f7971e, #ffd200); }
.app:nth-child(3) i { background: linear-gradient(135deg, #1877f2, #4facfe); }
.app:nth-child(4) i { background: linear-gradient(135deg, #e4405f, #ff7eb3); }
.app:nth-child(5) i { background: linear-gradient(135deg, #25d366, #128c7e); }
.app:nth-child(6) i { background: linear-gradient(135deg, #000000, #434343); }
.app:nth-child(7) i { background: linear-gradient(135deg, #0a66c2, #00c6ff); }
.app:nth-child(8) i { background: linear-gradient(135deg, #ff5f6d, #ffc371); }
.app:nth-child(9) i { background: linear-gradient(135deg, #36d1dc, #5b86e5); }
.app:nth-child(10) i { background: linear-gradient(135deg, #c471f5, #fa71cd); }

/* HOVER EFFECT */
.app:hover i {
    transform: translateY(-6px) scale(1.1);
    box-shadow: 0 12px 25px rgba(0,0,0,0.5);
}

/* TEXT UNDER ICON */
.app span {
    display: block;
    margin-top: 3px;
    font-size: 12px;
}

/* BOTTOM SOCIAL BAR */
.icons {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 70px;

    display: flex;
    justify-content: space-around;
    align-items: center;

    /* glass effect */
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);

    border-top: 1px solid rgba(255,255,255,0.2);
}

/* SOCIAL ICONS */
.icons a {
    font-size: 22px;
    color: white;
    transition: 0.3s;
}

/* HOVER GLOW */
.icons a:hover {
    transform: scale(1.3);
    text-shadow: 0 0 10px rgba(255,255,255,0.8);
}

/* MOBILE RESPONSIVE (optional) */
@media (max-width: 400px) {
    .phone {
        width: 95%;
        height: 90vh;
    }
}

/* Screen holds iframe */
.screen {
    height: calc(100% - 70px);
    overflow: hidden;
}

/* Iframe fills screen */
.frame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}
</style>
<body>

<div class="phone">

    <!-- IFRAME = FULL PHONE CONTENT -->
    <iframe 
        class="frame"
        src="file:///C:/Users/Bolokaiemi/udatemywork/index.html">
    </iframe>

</div>

</body>
</html>
